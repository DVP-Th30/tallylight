[package]
name = "tallylight-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen-side client for tallylight: pair with a machine and receive its agent sessions"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# Un écran n'a besoin ni des métriques ni de l'ouverture de ports sur la box : bibliothèque plus légère
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1.0.0"
serde_json = "1.0.154"
tallylight-core = { version = "0.1.0", path = "../tallylight-core" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "time"] }
