[package]
name = "tallylight"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
getrandom = "0.4.3"
iroh = "1.4.1"
iroh-tickets = "1.0.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tallylight-client = { version = "0.0.0", path = "../tallylight-client" }
tallylight-core = { version = "0.0.0", path = "../tallylight-core" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util", "time", "net", "sync", "signal"] }
