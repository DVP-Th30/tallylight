[package]
name = "tallylight"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The state of your coding agent sessions, streamed to the screens you pair"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
getrandom = "0.4.3"
iroh = "1.4.2"
iroh-tickets = "1.0.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# Ordre des clés conservé : `install` réécrit les réglages de l'utilisateur sans les mélanger
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tallylight-client = { version = "0.1.1", path = "../tallylight-client" }
tallylight-core = { version = "0.1.1", path = "../tallylight-core" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util", "time", "net", "sync", "signal"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Existence d'un processus, console du démon lancé par la tâche planifiée
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
