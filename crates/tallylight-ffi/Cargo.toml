[package]
name = "tallylight-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Liaisons Kotlin et Swift de la bibliothèque d'écran tallylight"

[lib]
name = "tallylight_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
tallylight-client = { version = "0.0.0", path = "../tallylight-client" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync"] }
uniffi = { version = "0.32.2", features = ["cli"] }

[target.'cfg(target_os = "android")'.dependencies]
iroh = "1.4.1"
jni = "0.21"
