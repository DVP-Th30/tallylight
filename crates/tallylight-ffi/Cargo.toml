[package]
name = "tallylight-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kotlin and Swift bindings (UniFFI) for the tallylight screen client"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tallylight_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tallylight-client = { version = "0.1.0", path = "../tallylight-client" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync"] }
uniffi = "0.32.2"

[target.'cfg(target_os = "android")'.dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
jni = "0.21"
