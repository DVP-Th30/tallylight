name: android

# Construit la bibliothèque Android (AAR : arm64 et x86_64) et la joint à la version.
# Sur une étiquette `v*`, automatiquement. À la main : sans `tag`, simple répétition (l'AAR reste
# un artefact du run) ; avec `tag`, construit le code de cette étiquette et le joint à sa version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: version existante à compléter (vide = répétition sans publication)
        default: ""

permissions:
  contents: write

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Construire l'AAR
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build-aar.sh
      - name: Empreintes
        working-directory: target/android
        run: |
          ls -l
          for file in tallylight-*.aar tallylight-*-sources.jar; do sha256sum "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: tallylight-android
          path: |
            target/android/*.aar
            target/android/*.jar
            target/android/*.sha256
      - name: Dépôt dans la version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        working-directory: target/android
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" tallylight-*.aar tallylight-*.jar tallylight-*.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
