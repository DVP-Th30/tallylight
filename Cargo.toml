[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DVP-Th30/tallylight"

# Bibliothèque embarquée dans une application : la taille prime sur la vitesse
[profile.embed]
inherits = "release"
opt-level = "s"
strip = true
codegen-units = 4
